<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Reisverslagen · Urlaubspotter</title>
    <link rel="stylesheet" href="site.css?v=36">
    <style>
        /* ========= REISVERSLAGEN — magazine layout ========= */
        .rv-hero {
            background: linear-gradient(135deg, #faf3e6 0%, #ede0c5 100%);
            padding: 56px 24px 64px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .rv-hero::before {
            content: "";
            position: absolute;
            top: -120px; right: -100px;
            width: 480px; height: 480px;
            background: radial-gradient(circle, rgba(255,240,200,0.55) 0%, transparent 62%);
            pointer-events: none;
        }
        .rv-hero-inner { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
        .rv-hero .eyebrow {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #8b6914;
            margin-bottom: 12px;
        }
        .rv-hero h1 {
            font-size: clamp(2rem, 5vw, 3.4rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.05;
            color: #2a2417;
            margin: 0 0 14px;
        }
        .rv-hero p {
            font-size: clamp(1.05rem, 1.5vw, 1.18rem);
            line-height: 1.6;
            color: #6f624a;
            margin: 0;
        }

        /* Category filter tabs */
        .rv-filter {
            max-width: 1280px;
            margin: 32px auto 24px;
            padding: 0 24px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .rv-filter-pill {
            padding: 8px 16px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: all 0.18s ease;
        }
        .rv-filter-pill:hover { border-color: #8b6914; color: #8b6914; }
        .rv-filter-pill.active {
            background: #2a2417;
            border-color: #2a2417;
            color: white;
        }

        /* Featured (large card, first story) */
        .rv-featured {
            max-width: 1280px;
            margin: 0 auto 32px;
            padding: 0 24px;
        }
        .rv-featured-card {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 0;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 8px 28px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.04);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .rv-featured-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 42px rgba(0,0,0,0.10);
        }
        .rv-featured-img {
            aspect-ratio: 4/3;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .rv-featured-img .rv-badge {
            position: absolute; top: 18px; left: 18px;
            background: white;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #8b6914;
        }
        .rv-featured-body {
            padding: 36px 36px 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
        }
        .rv-featured-body .author {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            color: #8b6914;
        }
        .rv-featured-body h2 {
            font-size: clamp(1.4rem, 2.6vw, 1.9rem);
            line-height: 1.2;
            letter-spacing: -0.015em;
            margin: 0;
            font-weight: 800;
        }
        .rv-featured-body p {
            font-size: 1rem;
            line-height: 1.55;
            color: var(--secondary);
            margin: 0;
        }
        .rv-featured-body .read-cta {
            font-weight: 700;
            color: #8b6914;
            font-size: 0.92rem;
            text-decoration: none;
            align-self: flex-start;
        }
        @media (max-width: 760px) {
            .rv-featured-card { grid-template-columns: 1fr; }
            .rv-featured-body { padding: 24px 22px 26px; }
        }

        /* Magazine grid */
        .rv-grid {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px 56px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 26px;
        }
        .rv-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(0,0,0,0.06);
            box-shadow: 0 4px 14px rgba(0,0,0,0.04);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
            display: flex;
            flex-direction: column;
        }
        .rv-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 32px rgba(0,0,0,0.08);
        }
        .rv-card-img {
            aspect-ratio: 16/10;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .rv-card-img .rv-badge {
            position: absolute; top: 14px; left: 14px;
            background: white;
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #8b6914;
        }
        .rv-card-body {
            padding: 20px 22px 22px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }
        .rv-card-author {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
            color: var(--secondary);
        }
        .rv-card h3 {
            font-size: 1.08rem;
            line-height: 1.3;
            letter-spacing: -0.01em;
            margin: 0;
            font-weight: 800;
        }
        .rv-card p {
            font-size: 0.93rem;
            line-height: 1.55;
            color: var(--secondary);
            margin: 0;
        }
        .rv-card .read-cta {
            font-weight: 700;
            color: #8b6914;
            font-size: 0.88rem;
            margin-top: auto;
            padding-top: 6px;
        }
        .rv-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--secondary);
            padding: 40px 0;
        }
    </style>
</head>
<body>

<header class="site-header"><div class="inner"></div></header>

<nav class="breadcrumb" id="bc">
    <a href="Homepagina.html">Home</a>
    <span class="sep">›</span>
    <span class="current">Reisverslagen</span>
</nav>

<section class="rv-hero">
    <div class="rv-hero-inner">
        <span class="eyebrow">Van de redactie</span>
        <h1>Reisverslagen</h1>
        <p>Eerlijke verslagen van onze redactie — zelf bezocht, zelf getest. Van Toscaanse glamping-pods tot wellness-weekenden in eigen land.</p>
    </div>
</section>

<div class="rv-filter" id="rv-filter"></div>
<div class="rv-featured" id="rv-featured"></div>
<div class="rv-grid" id="rv-grid"></div>

<section class="section">
    <div class="news-social" id="news-social"></div>
</section>

<footer class="site-footer">
    <div class="footer-inner"></div>
    <div class="footer-bottom"></div>
</footer>

<script src="site-data.js?v=14"></script>
<script src="site.js?v=31"></script>
<script>
    renderHeader('');
    renderNewsSocial('news-social');
    renderFooter();

    // SVG-data-URI uit het bestaande gradient|emoji formaat. Iedere
    // story heeft een eigen kleurverloop + iconisch emoji als hero.
    function bgImage(spec) {
        const m = (spec || '').match(/^gradient:([^,]+),([^|]+)\|(.+)$/);
        if (!m) return '';
        const [, c1, c2, emoji] = m;
        return `data:image/svg+xml;utf8,${encodeURIComponent(
            `<svg xmlns='http://www.w3.org/2000/svg' width='600' height='360' viewBox='0 0 600 360'>
             <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
             <stop offset='0%' stop-color='${c1}'/><stop offset='100%' stop-color='${c2}'/>
             </linearGradient></defs>
             <rect width='600' height='360' fill='url(%23g)'/>
             <text x='300' y='230' font-size='140' text-anchor='middle' font-family='system-ui'>${emoji}</text>
             </svg>`)}`;
    }

    // Auteur-rol uit het author-veld extraheren ("Lisa · Redacteur
    // kamperen" → "Redacteur kamperen") zodat het filter-pillsysteem
    // op rol kan filteren in plaats van op auteursnaam.
    function authorRole(author) {
        if (!author) return 'Algemeen';
        const idx = author.indexOf('·');
        return idx >= 0 ? author.slice(idx + 1).trim() : author;
    }
    function shortIntro(text, max) {
        if (!text) return '';
        const m = max || 150;
        if (text.length <= m) return text;
        return text.slice(0, m).replace(/\s+\S*$/, '') + '…';
    }

    const ALL_STORIES = (SITE_DATA.stories || []).slice()
        .sort((a,b) => (b.date || '').localeCompare(a.date || ''));
    const roleSet = new Set(['Alle']);
    ALL_STORIES.forEach(s => roleSet.add(authorRole(s.author)));

    // Filter-pills bovenaan: "Alle" + één pill per redacteur-rol.
    let activeRole = 'Alle';
    const filterEl = document.getElementById('rv-filter');
    function renderFilter() {
        filterEl.innerHTML = Array.from(roleSet).map(r => `
            <button type="button" class="rv-filter-pill${r === activeRole ? ' active' : ''}" data-role="${r}">${r}</button>
        `).join('');
    }
    filterEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.rv-filter-pill');
        if (!btn) return;
        activeRole = btn.dataset.role;
        renderFilter();
        renderStories();
    });
    renderFilter();

    function visibleStories() {
        if (activeRole === 'Alle') return ALL_STORIES;
        return ALL_STORIES.filter(s => authorRole(s.author) === activeRole);
    }

    function renderStories() {
        const list = visibleStories();
        const featuredEl = document.getElementById('rv-featured');
        const gridEl = document.getElementById('rv-grid');
        if (!list.length) {
            featuredEl.innerHTML = '';
            gridEl.innerHTML = '<div class="rv-empty">Geen reisverslagen in deze categorie.</div>';
            return;
        }
        // Featured = meest recent (eerste item) — krijgt grote magazine-card.
        const first = list[0];
        const rest = list.slice(1);
        featuredEl.innerHTML = `
            <a class="rv-featured-card" href="reisverslag-detail.html?id=${first.id}">
                <div class="rv-featured-img" style="background-image:url('${bgImage(first.image)}');">
                    <span class="rv-badge">${authorRole(first.author)}</span>
                </div>
                <div class="rv-featured-body">
                    <span class="author">Door ${first.author}</span>
                    <h2>${first.title}</h2>
                    <p>${shortIntro(first.content, 220)}</p>
                    <span class="read-cta">Lees het verslag →</span>
                </div>
            </a>
        `;
        gridEl.innerHTML = rest.map(s => `
            <a class="rv-card" href="reisverslag-detail.html?id=${s.id}">
                <div class="rv-card-img" style="background-image:url('${bgImage(s.image)}');">
                    <span class="rv-badge">${authorRole(s.author)}</span>
                </div>
                <div class="rv-card-body">
                    <span class="rv-card-author">Door ${s.author}</span>
                    <h3>${s.title}</h3>
                    <p>${shortIntro(s.content, 140)}</p>
                    <span class="read-cta">Lees het verslag →</span>
                </div>
            </a>
        `).join('');
    }
    renderStories();
</script>
</body>
</html>
