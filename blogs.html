<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Blogs &amp; Tips · Urlaubspotter</title>
    <link rel="stylesheet" href="site.css?v=26">
    <style>
        /* ========= BLOGS & TIPS — magazine layout ========= */
        .bg-hero {
            background: linear-gradient(135deg, #e9f0e1 0%, #c8d6b8 100%);
            padding: 56px 24px 64px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .bg-hero::before {
            content: "";
            position: absolute;
            top: -120px; right: -100px;
            width: 480px; height: 480px;
            background: radial-gradient(circle, rgba(212,232,178,0.6) 0%, transparent 62%);
            pointer-events: none;
        }
        .bg-hero-inner { max-width: 760px; margin: 0 auto; position: relative; z-index: 1; }
        .bg-hero .eyebrow {
            display: inline-block;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #3f6b3a;
            margin-bottom: 12px;
        }
        .bg-hero h1 {
            font-size: clamp(2rem, 5vw, 3.4rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            line-height: 1.05;
            color: #1f2b1c;
            margin: 0 0 14px;
        }
        .bg-hero p {
            font-size: clamp(1.05rem, 1.5vw, 1.18rem);
            line-height: 1.6;
            color: #4f5d49;
            margin: 0;
        }

        /* Category filter pills */
        .bg-filter {
            max-width: 1280px;
            margin: 32px auto 28px;
            padding: 0 24px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .bg-filter-pill {
            padding: 8px 16px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 999px;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--text);
            cursor: pointer;
            transition: all 0.18s ease;
        }
        .bg-filter-pill:hover { border-color: #3f6b3a; color: #3f6b3a; }
        .bg-filter-pill.active {
            background: #1f2b1c;
            border-color: #1f2b1c;
            color: white;
        }

        /* Featured (one big card per category) */
        .bg-featured {
            max-width: 1280px;
            margin: 0 auto 36px;
            padding: 0 24px;
        }
        .bg-featured-card {
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 0;
            background: white;
            border-radius: 18px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 8px 28px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.04);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .bg-featured-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 18px 42px rgba(0,0,0,0.10);
        }
        .bg-featured-img {
            aspect-ratio: 4/3;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .bg-featured-img .bg-badge {
            position: absolute; top: 18px; left: 18px;
            background: white;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #3f6b3a;
        }
        .bg-featured-body {
            padding: 36px 36px 32px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 14px;
        }
        .bg-featured-body .meta {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            font-weight: 700;
            color: #3f6b3a;
        }
        .bg-featured-body h2 {
            font-size: clamp(1.4rem, 2.6vw, 1.9rem);
            line-height: 1.2;
            letter-spacing: -0.015em;
            margin: 0;
            font-weight: 800;
        }
        .bg-featured-body p {
            font-size: 1rem;
            line-height: 1.55;
            color: var(--secondary);
            margin: 0;
        }
        .bg-featured-body .read-cta {
            font-weight: 700;
            color: #3f6b3a;
            font-size: 0.92rem;
            text-decoration: none;
            align-self: flex-start;
        }
        @media (max-width: 760px) {
            .bg-featured-card { grid-template-columns: 1fr; }
            .bg-featured-body { padding: 24px 22px 26px; }
        }

        /* Magazine grid */
        .bg-grid {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 24px 56px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }
        .bg-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            border: 1px solid rgba(0,0,0,0.06);
            box-shadow: 0 4px 14px rgba(0,0,0,0.04);
            transition: transform 0.22s ease, box-shadow 0.22s ease;
            display: flex;
            flex-direction: column;
        }
        .bg-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 32px rgba(0,0,0,0.08);
        }
        .bg-card-img {
            aspect-ratio: 16/10;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .bg-card-img .bg-badge {
            position: absolute; top: 14px; left: 14px;
            background: white;
            padding: 5px 11px;
            border-radius: 999px;
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #3f6b3a;
        }
        .bg-card-body {
            padding: 20px 22px 22px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }
        .bg-card-meta {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-weight: 700;
            color: var(--secondary);
        }
        .bg-card h3 {
            font-size: 1.08rem;
            line-height: 1.3;
            letter-spacing: -0.01em;
            margin: 0;
            font-weight: 800;
        }
        .bg-card p {
            font-size: 0.93rem;
            line-height: 1.55;
            color: var(--secondary);
            margin: 0;
        }
        .bg-card .read-cta {
            font-weight: 700;
            color: #3f6b3a;
            font-size: 0.88rem;
            margin-top: auto;
            padding-top: 6px;
        }
        .bg-empty {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--secondary);
            padding: 40px 0;
        }
    </style>
</head>
<body>

<header class="site-header"><div class="inner"></div></header>

<nav class="breadcrumb" id="bc">
    <a href="Homepagina.html">Home</a>
    <span class="sep">›</span>
    <span class="current">Blogs &amp; Tips</span>
</nav>

<section class="bg-hero">
    <div class="bg-hero-inner">
        <span class="eyebrow">Inspiratie</span>
        <h1>Blogs &amp; Tips</h1>
        <p>Reistips, bestemmingen en inspiratie van onze redactie. Van hidden gems en wellness-spots tot eerste-keer-tips voor kampeerders en wintersporters.</p>
    </div>
</section>

<div class="bg-filter" id="bg-filter"></div>
<div class="bg-featured" id="bg-featured"></div>
<div class="bg-grid" id="bg-grid"></div>

<section class="section">
    <div class="news-social" id="news-social"></div>
</section>

<footer class="site-footer">
    <div class="footer-inner"></div>
    <div class="footer-bottom"></div>
</footer>

<script src="site-data.js?v=14"></script>
<script src="site.js?v=23"></script>
<script>
    renderHeader('');
    renderNewsSocial('news-social');
    renderFooter();

    function bgImage(spec) {
        const m = (spec || '').match(/^gradient:([^,]+),([^|]+)\|(.+)$/);
        if (!m) return '';
        const [, c1, c2, emoji] = m;
        return `data:image/svg+xml;utf8,${encodeURIComponent(
            `<svg xmlns='http://www.w3.org/2000/svg' width='600' height='360' viewBox='0 0 600 360'>
             <defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>
             <stop offset='0%' stop-color='${c1}'/><stop offset='100%' stop-color='${c2}'/>
             </linearGradient></defs>
             <rect width='600' height='360' fill='url(%23g)'/>
             <text x='300' y='230' font-size='140' text-anchor='middle' font-family='system-ui'>${emoji}</text>
             </svg>`)}`;
    }
    function readMinutes(blog) {
        // Schatting: ~200 woorden/min, content + intro samen.
        const text = (blog.intro || '') + ' ' + (blog.content || '');
        const words = text.trim().split(/\s+/).length;
        return Math.max(2, Math.round(words / 200));
    }
    function formatDate(d) {
        if (!d) return '';
        const date = new Date(d);
        if (isNaN(date)) return d;
        return date.toLocaleDateString('nl-NL', { day: 'numeric', month: 'long', year: 'numeric' });
    }

    const ALL_BLOGS = (SITE_DATA.blogs || []).slice()
        .sort((a,b) => (b.date || '').localeCompare(a.date || ''));
    const catSet = new Set(['Alle']);
    ALL_BLOGS.forEach(b => catSet.add(b.category || 'Algemeen'));

    let activeCat = 'Alle';
    const filterEl = document.getElementById('bg-filter');
    function renderFilter() {
        filterEl.innerHTML = Array.from(catSet).map(c => `
            <button type="button" class="bg-filter-pill${c === activeCat ? ' active' : ''}" data-cat="${c}">${c}</button>
        `).join('');
    }
    filterEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.bg-filter-pill');
        if (!btn) return;
        activeCat = btn.dataset.cat;
        renderFilter();
        renderBlogs();
    });
    renderFilter();

    function visibleBlogs() {
        if (activeCat === 'Alle') return ALL_BLOGS;
        return ALL_BLOGS.filter(b => (b.category || 'Algemeen') === activeCat);
    }

    function renderBlogs() {
        const list = visibleBlogs();
        const featuredEl = document.getElementById('bg-featured');
        const gridEl = document.getElementById('bg-grid');
        if (!list.length) {
            featuredEl.innerHTML = '';
            gridEl.innerHTML = '<div class="bg-empty">Geen blogs in deze categorie.</div>';
            return;
        }
        const first = list[0];
        const rest = list.slice(1);
        featuredEl.innerHTML = `
            <a class="bg-featured-card" href="blog-detail.html?id=${first.id}">
                <div class="bg-featured-img" style="background-image:url('${bgImage(first.image)}');">
                    <span class="bg-badge">${first.category || 'Algemeen'}</span>
                </div>
                <div class="bg-featured-body">
                    <span class="meta">${formatDate(first.date)} · ${readMinutes(first)} min lezen</span>
                    <h2>${first.title}</h2>
                    <p>${first.intro || ''}</p>
                    <span class="read-cta">Lees het artikel →</span>
                </div>
            </a>
        `;
        gridEl.innerHTML = rest.map(b => `
            <a class="bg-card" href="blog-detail.html?id=${b.id}">
                <div class="bg-card-img" style="background-image:url('${bgImage(b.image)}');">
                    <span class="bg-badge">${b.category || 'Algemeen'}</span>
                </div>
                <div class="bg-card-body">
                    <span class="bg-card-meta">${formatDate(b.date)} · ${readMinutes(b)} min lezen</span>
                    <h3>${b.title}</h3>
                    <p>${b.intro || ''}</p>
                    <span class="read-cta">Lees het artikel →</span>
                </div>
            </a>
        `).join('');
    }
    renderBlogs();
</script>
</body>
</html>
